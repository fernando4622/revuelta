openapi: 3.0.3
info:
  title: ReVuelta REST API
  description: Operational Container Control System API for University Cafeteria Pilot V1
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Development Server

paths:
  /auth/login:
    post:
      summary: Authenticate user and obtain JWT token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "operator" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tokenType: { type: string, example: "Bearer" }
                  userId: { type: string, format: uuid }
                  username: { type: string }
                  role:
                    type: string
                    enum: [PARTICIPANT, OPERATOR, ADMIN]
                    example: "OPERATOR"
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          description: Invalid username or password
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /containers:
    post:
      summary: Register new container (ADMIN only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "CTR-100" }
      responses:
        '201':
          $ref: '#/components/responses/ContainerResponse'
        '409':
          $ref: '#/components/responses/409Conflict'
    get:
      summary: List containers (paginated)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Container'

  /containers/{containerId}:
    get:
      summary: Get container by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /containers/{containerId}/activate:
    post:
      summary: Activate container REGISTERED -> AVAILABLE (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'

  /circulations:
    post:
      summary: Register container delivery (create active circulation)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerId, borrowerId]
              properties:
                containerId: { type: string, format: uuid }
                borrowerId: { type: string, format: uuid }
      responses:
        '201':
          $ref: '#/components/responses/CirculationResponse'
        '409':
          $ref: '#/components/responses/409Conflict'

  /circulations/containers/{containerId}/return:
    post:
      summary: Register container return and finalize active circulation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/CirculationResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /containers/{containerId}/events:
    get:
      summary: Get container audit history events
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerEvent'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, detail, instance, traceId, timestamp, errors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: "INVALID_CREDENTIALS" }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          items: { type: string }

    Container:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, AVAILABLE, IN_USE, DAMAGED, LOST, RETIRED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eligibleForCirculation: { type: boolean }

    Circulation:
      type: object
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, format: uuid }
        borrowerId: { type: string, format: uuid }
        deliveredBy: { type: string, format: uuid }
        deliveredAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnedBy: { type: string, format: uuid }
        returnedAt: { type: string, format: date-time }
        punctuality: { type: string, enum: [ON_TIME, LATE] }
        status: { type: string, enum: [ACTIVE, COMPLETED] }

    ContainerEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, format: uuid }
        eventType: { type: string }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        previousStatus: { type: string }
        newStatus: { type: string }
        reason: { type: string }

  responses:
    ContainerResponse:
      description: Container object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Container'
    CirculationResponse:
      description: Circulation object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Circulation'
    400BadRequest:
      description: Bad Request / Validation Failure
    404NotFound:
      description: Resource Not Found
    409Conflict:
      description: Business Conflict / State Machine Error
