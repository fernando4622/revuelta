openapi: 3.0.3
info:
  title: ReVuelta REST API
  description: Operational Container Control System API for University Cafeteria Pilot V1
  version: 1.0.0
servers:
  - url: /api/v1
    description: Deployment-relative API base

paths:
  /auth/login:
    post:
      summary: Authenticate user and obtain JWT token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "operator" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Successful authentication
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tokenType: { type: string, example: "Bearer" }
                  userId: { type: string, format: uuid }
                  username: { type: string }
                  role:
                    type: string
                    enum: [PARTICIPANT, OPERATOR, ADMIN]
                    example: "OPERATOR"
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          description: Invalid username or password
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /me/operation-qrs:
    post:
      summary: Generate a short-lived participant QR for delivery or return
      operationId: generateOperationQr
      x-required-roles: [PARTICIPANT]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [DELIVERY, RETURN] }
      responses:
        '201':
          description: Server-issued operation QR
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperationQr' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /operation-qr-resolutions:
    post:
      summary: Resolve a participant operation QR without consuming it
      operationId: resolveOperationQr
      x-required-roles: [OPERATOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Minimal participant handoff identity
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedOperationQr' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /container-qr-resolutions:
    post:
      summary: Resolve a signed current-generation container QR
      operationId: resolveContainerQr
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string, maxLength: 512 }
      responses:
        '200':
          description: Real operational container state and allowed actions
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedContainerQr' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /containers:
    post:
      summary: Register new container (ADMIN only)
      operationId: registerContainer
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "CTR-100" }
      responses:
        '201':
          $ref: '#/components/responses/RegisteredContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    get:
      summary: List containers (paginated)
      operationId: listContainers
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated container results for the requested page
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Container'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}:
    get:
      summary: Get container by ID
      operationId: getContainer
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}/activate:
    post:
      summary: Activate container REGISTERED -> AVAILABLE (ADMIN only)
      operationId: activateContainer
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Initial activation" }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}/qr:
    get:
      summary: Retrieve the current printable container QR
      operationId: getContainerQr
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current container QR payload
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerQr' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /containers/{containerId}/qr-rotations:
    post:
      summary: Rotate one container QR and invalidate its previous label
      operationId: rotateContainerQr
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Newly rotated container QR payload
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContainerQr' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /delivery-previews:
    post:
      summary: Validate both delivery QR values and obtain a read-only policy preview
      description: Does not reserve the container or consume the participant QR. The estimated due-at is not authoritative until delivery commits.
      operationId: previewDelivery
      x-required-roles: [OPERATOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantQrPayload, containerQrPayload]
              properties:
                participantQrPayload: { type: string, minLength: 1, maxLength: 512 }
                containerQrPayload: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Current delivery eligibility and server policy preview
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPreview' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /circulations:
    post:
      summary: Register container delivery (create active circulation)
      description: Both signed QR payloads are revalidated atomically. A replay after a committed delivery returns `409 QR_ALREADY_USED`. No client idempotency key is accepted in the MVP.
      operationId: deliverContainer
      x-required-roles: [OPERATOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantQrPayload, containerQrPayload]
              properties:
                participantQrPayload: { type: string, minLength: 1, maxLength: 512 }
                containerQrPayload: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '201':
          description: Atomic delivery result
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delivery' }
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /return-previews:
    post:
      summary: Validate both return QR values and obtain a read-only circulation preview
      description: Does not finalize the circulation, change container state or consume the participant QR.
      operationId: previewReturn
      x-required-roles: [OPERATOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DualQrHandoffRequest' }
      responses:
        '200':
          description: Current return eligibility and active circulation preview
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnPreview' }
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /circulation-returns:
    post:
      summary: Register a physical container return using both QR values
      description: Both signed QR payloads are revalidated atomically. Success finalizes possession and leaves the container in `RETURNED` pending wash. A consumed participant QR receives `409 QR_ALREADY_USED`; a fresh QR for an already-returned container receives `409 RETURN_ALREADY_REGISTERED`.
      operationId: returnContainer
      x-required-roles: [OPERATOR]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DualQrHandoffRequest' }
      responses:
        '200':
          description: Atomic return result
          headers:
            X-Correlation-ID: { $ref: '#/components/headers/CorrelationId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReturnReceipt' }
        '400': { $ref: '#/components/responses/400BadRequest' }
        '401': { $ref: '#/components/responses/401Unauthenticated' }
        '403': { $ref: '#/components/responses/403Forbidden' }
        '404': { $ref: '#/components/responses/404NotFound' }
        '409': { $ref: '#/components/responses/409Conflict' }
        '500': { $ref: '#/components/responses/500InternalServerError' }

  /containers/{containerId}/history:
    get:
      summary: Get container audit history events
      operationId: getContainerEvents
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Append-oriented audit events for the container
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerEvent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

components:
  headers:
    CorrelationId:
      description: Server-generated identifier for correlating this response with operational logs
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, detail, instance, traceId, timestamp, errors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: "INVALID_CREDENTIALS" }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          items: { type: string }

    Container:
      type: object
      required: [id, code, status, createdAt, updatedAt, eligibleForCirculation]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eligibleForCirculation: { type: boolean }

    RegisteredContainer:
      type: object
      required: [id, code, status, createdAt, updatedAt, eligibleForCirculation, qrGeneration, qrPayload]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eligibleForCirculation: { type: boolean }
        qrGeneration: { type: integer, minimum: 1 }
        qrPayload: { type: string }

    OperationQr:
      type: object
      required: [tokenRef, purpose, payload, issuedAt, expiresAt]
      properties:
        tokenRef: { type: string, format: uuid }
        purpose: { type: string, enum: [DELIVERY, RETURN] }
        payload: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }

    ResolvedOperationQr:
      type: object
      required: [tokenRef, participantRef, purpose, expiresAt, eligibility]
      properties:
        tokenRef: { type: string, format: uuid }
        participantRef: { type: string, format: uuid }
        purpose: { type: string, enum: [DELIVERY, RETURN] }
        expiresAt: { type: string, format: date-time }
        eligibility: { type: string, enum: [ELIGIBLE] }

    ActiveCirculationSummary:
      type: object
      required: [circulationRef, participantRef, deliveredAt, dueAt]
      properties:
        circulationRef: { type: string, format: uuid }
        participantRef: { type: string, format: uuid }
        deliveredAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }

    ResolvedContainerQr:
      type: object
      required: [containerRef, displayCode, state, stateLabel, eligibleForCirculation, allowedActions]
      properties:
        containerRef: { type: string, format: uuid }
        displayCode: { type: string }
        state: { type: string, enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST] }
        stateLabel: { type: string }
        eligibleForCirculation: { type: boolean }
        activeCirculation:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ActiveCirculationSummary'
        allowedActions:
          type: array
          items: { type: string, enum: [ACTIVATE, DELIVER, RETURN, COMPLETE_WASH, ROTATE_QR, VIEW_HISTORY] }

    ContainerQr:
      type: object
      required: [containerRef, generation, payload]
      properties:
        containerRef: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        payload: { type: string }

    DeliveryContainer:
      type: object
      required: [id, publicCode, state]
      properties:
        id: { type: string, format: uuid }
        publicCode: { type: string }
        state: { type: string, enum: [AVAILABLE, IN_USE] }

    DualQrHandoffRequest:
      type: object
      required: [participantQrPayload, containerQrPayload]
      properties:
        participantQrPayload: { type: string, minLength: 1, maxLength: 512 }
        containerQrPayload: { type: string, minLength: 1, maxLength: 512 }

    DeliveryPolicy:
      type: object
      required: [id, version, name, durationHours]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        durationHours: { type: integer, minimum: 1 }

    DeliveryPreview:
      type: object
      required: [participantRef, container, policy, previewedAt, estimatedDueAt, traceId]
      properties:
        participantRef: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/DeliveryContainer' }
        policy: { $ref: '#/components/schemas/DeliveryPolicy' }
        previewedAt: { type: string, format: date-time }
        estimatedDueAt: { type: string, format: date-time }
        traceId: { type: string, format: uuid }

    Delivery:
      type: object
      required: [circulationId, participantRef, container, deliveredAt, dueAt, policy, traceId]
      properties:
        circulationId: { type: string, format: uuid }
        participantRef: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/DeliveryContainer' }
        deliveredAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        policy: { $ref: '#/components/schemas/DeliveryPolicy' }
        traceId: { type: string, format: uuid }

    ReturnContainer:
      type: object
      required: [id, publicCode, state, stateLabel]
      properties:
        id: { type: string, format: uuid }
        publicCode: { type: string }
        state: { type: string, enum: [IN_USE, RETURNED] }
        stateLabel: { type: string, enum: [En uso, Pendiente de lavado] }

    ReturnPreview:
      type: object
      required: [circulationId, participantRef, container, deliveredAt, dueAt, previewedAt, traceId]
      properties:
        circulationId: { type: string, format: uuid }
        participantRef: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/ReturnContainer' }
        deliveredAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        previewedAt: { type: string, format: date-time }
        traceId: { type: string, format: uuid }

    ReturnReceipt:
      type: object
      required: [circulationId, participantRef, container, returnedAt, punctuality, traceId]
      properties:
        circulationId: { type: string, format: uuid }
        participantRef: { type: string, format: uuid }
        container: { $ref: '#/components/schemas/ReturnContainer' }
        returnedAt: { type: string, format: date-time }
        punctuality: { type: string, enum: [ON_TIME, LATE] }
        traceId: { type: string, format: uuid }

    ContainerEvent:
      type: object
      required: [id, containerId, eventType, actorId, occurredAt, newStatus, correlationId]
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, format: uuid }
        eventType: { type: string }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        previousStatus:
          type: string
          enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED]
          nullable: true
        newStatus:
          type: string
          enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED]
        reason: { type: string, nullable: true }
        correlationId: { type: string, format: uuid }
        participantRef: { type: string, format: uuid, nullable: true }
        circulationRef: { type: string, format: uuid, nullable: true }

  responses:
    401Unauthenticated:
      description: Authentication is missing, invalid or expired
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://revuelta.app/problems/unauthenticated
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: Authentication is required or the supplied token is invalid
            instance: /api/v1/containers
            traceId: 3a06ba13-6a4c-49c1-92c7-13281f51d757
            timestamp: '2026-09-20T15:38:50Z'
            errors: []
    403Forbidden:
      description: The authenticated role is not authorized for the operation
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
