openapi: 3.0.3
info:
  title: ReVuelta REST API
  description: Operational Container Control System API for University Cafeteria Pilot V1
  version: 1.0.0
servers:
  - url: /api/v1
    description: Deployment-relative API base

paths:
  /auth/login:
    post:
      summary: Authenticate user and obtain JWT token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: "operator" }
                password: { type: string, example: "password123" }
      responses:
        '200':
          description: Successful authentication
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  tokenType: { type: string, example: "Bearer" }
                  userId: { type: string, format: uuid }
                  username: { type: string }
                  role:
                    type: string
                    enum: [PARTICIPANT, OPERATOR, ADMIN]
                    example: "OPERATOR"
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          description: Invalid username or password
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers:
    post:
      summary: Register new container (ADMIN only)
      operationId: registerContainer
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "CTR-100" }
      responses:
        '201':
          $ref: '#/components/responses/ContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    get:
      summary: List containers (paginated)
      operationId: listContainers
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated container results for the requested page
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Container'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}:
    get:
      summary: Get container by ID
      operationId: getContainer
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}/activate:
    post:
      summary: Activate container REGISTERED -> AVAILABLE (ADMIN only)
      operationId: activateContainer
      x-required-roles: [ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Initial activation" }
      responses:
        '200':
          $ref: '#/components/responses/ContainerResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /circulations:
    post:
      summary: Register container delivery (create active circulation)
      description: A replay after a committed delivery returns `409 ACTIVE_CIRCULATION_EXISTS`. No client idempotency key is accepted in the MVP.
      operationId: deliverContainer
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [containerId, borrowerId]
              properties:
                containerId: { type: string, format: uuid }
                borrowerId: { type: string, format: uuid }
      responses:
        '201':
          $ref: '#/components/responses/CirculationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /circulations/{circulationId}/return:
    post:
      summary: Register container return and finalize active circulation
      description: A replay after a committed return receives `409 RETURN_ALREADY_REGISTERED`. The successful transition leaves the container in `RETURNED` pending wash.
      operationId: returnCirculation
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: circulationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          $ref: '#/components/responses/CirculationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /containers/{containerId}/events:
    get:
      summary: Get container audit history events
      operationId: getContainerEvents
      x-required-roles: [OPERATOR, ADMIN]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: containerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Append-oriented audit events for the container
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContainerEvent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthenticated'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalServerError'

components:
  headers:
    CorrelationId:
      description: Server-generated identifier for correlating this response with operational logs
      required: true
      schema:
        type: string
        format: uuid

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ProblemDetail:
      type: object
      required: [type, title, status, code, detail, instance, traceId, timestamp, errors]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, example: "INVALID_CREDENTIALS" }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }
        errors:
          type: array
          items: { type: string }

    Container:
      type: object
      required: [id, code, status, createdAt, updatedAt, eligibleForCirculation]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { type: string, enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        eligibleForCirculation: { type: boolean }

    Circulation:
      type: object
      required:
        - id
        - containerId
        - borrowerId
        - deliveredBy
        - deliveredAt
        - dueAt
        - returnPolicyId
        - returnPolicyVersion
        - status
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, format: uuid }
        borrowerId: { type: string, format: uuid }
        deliveredBy: { type: string, format: uuid }
        deliveredAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time }
        returnPolicyId: { type: string, format: uuid }
        returnPolicyVersion: { type: integer, minimum: 1 }
        returnedBy: { type: string, format: uuid, nullable: true }
        returnedAt: { type: string, format: date-time, nullable: true }
        punctuality: { type: string, enum: [ON_TIME, LATE], nullable: true }
        status: { type: string, enum: [ACTIVE, COMPLETED] }

    ContainerEvent:
      type: object
      required: [id, containerId, eventType, actorId, occurredAt, newStatus, correlationId]
      properties:
        id: { type: string, format: uuid }
        containerId: { type: string, format: uuid }
        eventType: { type: string }
        actorId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        previousStatus:
          type: string
          enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED]
          nullable: true
        newStatus:
          type: string
          enum: [REGISTERED, AVAILABLE, IN_USE, RETURNED, DAMAGED, LOST, RETIRED]
        reason: { type: string, nullable: true }
        correlationId: { type: string, format: uuid }

  responses:
    401Unauthenticated:
      description: Authentication is missing, invalid or expired
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://revuelta.app/problems/unauthenticated
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: Authentication is required or the supplied token is invalid
            instance: /api/v1/containers
            traceId: 3a06ba13-6a4c-49c1-92c7-13281f51d757
            timestamp: '2026-09-20T15:38:50Z'
            errors: []
    403Forbidden:
      description: The authenticated role is not authorized for the operation
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: https://revuelta.app/problems/forbidden-operation
            title: Forbidden
            status: 403
            code: FORBIDDEN_OPERATION
            detail: You are not authorized to perform this operation
            instance: /api/v1/containers
            traceId: ad0147fa-b2e0-4ad4-a751-dfadf4384a23
            timestamp: '2026-09-20T15:38:50Z'
            errors: []
    ContainerResponse:
      description: Container object
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Container'
    CirculationResponse:
      description: Circulation object
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Circulation'
    400BadRequest:
      description: Bad Request / Validation Failure
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    404NotFound:
      description: Resource Not Found
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    409Conflict:
      description: Business Conflict / State Machine Error
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    500InternalServerError:
      description: Unexpected internal failure; use traceId for support correlation
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
