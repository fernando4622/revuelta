spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/revuelta_db
    username: revuelta_user
    password: revuelta_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false

logging:
  level:
    root: INFO
    com.revuelta.api: DEBUG
